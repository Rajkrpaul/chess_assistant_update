services:
  - type: web
    name: chess-assistant-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    nativePackages:
      - name: stockfish
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: STOCKFISH_PATH
        value: /usr/bin/stockfish
      - key: ALLOWED_ORIGIN
        value: https://chess-assistant-frontend.onrender.com

  - type: web
    name: chess-assistant-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://chess-assistant-backend.onrender.com
      - key: GROQ_API_KEY
        sync: false